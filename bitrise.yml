format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

# This file mirrors the config stored on bitrise.io for the app (the app does NOT read it from
# the repo). Keep the two in sync: update it through the Bitrise API / MCP or the Workflow editor.

meta:
  bitrise.io:
    stack: osx-xcode-16.4.x

app:
  envs:
  - BITRISE_PROJECT_PATH: FixtureApp.xcodeproj
  - BITRISE_SCHEME: FixtureApp
  # TS_BASE_REF and TS_CONFIG come from the build trigger only: an app-level default here
  # would override the trigger's value.

trigger_map:
# A changed_files filter on a PR trigger makes the backend load the PR's file list from the provider API.
- pull_request_target_branch: main
  changed_files:
    regex: ".*"
  workflow: selective_tests_trust_list
- push_branch: try/list/*
  workflow: selective_tests_trust_list
- push_branch: "*"
  workflow: selective_tests_main_base

workflows:
  # Baseline: same build, every test target runs. Compare its Test Reports with selective_tests.
  full_tests:
    steps:
    - git-clone@8: {}
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - xcode-test-without-building@1:
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2: {}

  # Webhook builds: diff against main.
  selective_tests_main_base:
    envs:
    - TS_BASE_REF: main
    after_run:
    - selective_tests

  # Manual builds pass TS_BASE_REF and optionally TS_CONFIG as build environment variables.
  selective_tests:
    steps:
    - git-clone@8: {}
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        - base_ref: $TS_BASE_REF
        - config: $TS_CONFIG
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/bitrise-step-xcode-test-without-building.git@test-selection:
        inputs:
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1:
        title: Show selection
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            echo "mode: ${BITRISE_TEST_SELECTION_MODE:-?}  summary: ${BITRISE_TEST_SELECTION_SUMMARY:-?}"
            if [ -n "$BITRISE_TEST_SELECTION_PATH" ]; then cat "$BITRISE_TEST_SELECTION_PATH"; fi
    - deploy-to-bitrise-io@2: {}

  # Same as selective_tests, but the git-clone step leaves a depth-1 clone behind.
  selective_tests_shallow:
    steps:
    - git-clone@8:
        inputs:
        - clone_depth: "1"
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        - base_ref: $TS_BASE_REF
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/bitrise-step-xcode-test-without-building.git@test-selection:
        inputs:
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2: {}

  # Trusts the backend's BITRISE_GIT_CHANGED_FILES list instead of diffing with git.
  selective_tests_trust_list:
    steps:
    - git-clone@8: {}
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - script@1:
        title: Show backend changed files
        inputs:
        - content: |-
            #!/usr/bin/env bash
            echo "BITRISE_GIT_CHANGED_FILES line count: $(printf '%s' "${BITRISE_GIT_CHANGED_FILES:-}" | grep -c . || true)"
            printf '%s\n' "${BITRISE_GIT_CHANGED_FILES:-}" | head -3
            echo "..."
            printf '%s\n' "${BITRISE_GIT_CHANGED_FILES:-}" | tail -3
            git fetch -q --depth=1 origin main && echo "git diff against main: $(git diff --name-only FETCH_HEAD...HEAD 2>/dev/null | wc -l | tr -d ' ') files"
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        - changed_files_complete: "true"
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/bitrise-step-xcode-test-without-building.git@test-selection:
        inputs:
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2: {}

  # Same selection, consumed by the one-shot Xcode Test step (build + test, no xctestrun).
  selective_tests_xcode_test:
    steps:
    - git-clone@8: {}
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        - base_ref: $TS_BASE_REF
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/steps-xcode-test.git@test-selection:
        inputs:
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2: {}

  # Shadow release check: the backend config injected as a workflow env, the test steps from their
  # test-selection-shadow branches. Every test runs; each step writes test-selection.json.
  shadow_tests:
    envs:
    - BITRISE_TEST_SELECTION_CONFIG_JSON: '{"mode":"shadow","base_ref":"main"}'
    - BITRISE_TEST_SELECTION_SHADOW_VERBOSE: 'true'
    steps:
    - git-clone@8: {}
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - git::https://github.com/bitrise-steplib/bitrise-step-xcode-test-without-building.git@test-selection-shadow:
        title: Xcode Test without building (shadow branch)
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - git::https://github.com/bitrise-steplib/steps-xcode-test.git@test-selection-shadow:
        title: Xcode Test (shadow branch)
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2:
        is_always_run: true
