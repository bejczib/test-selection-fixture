format_version: "17"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: ios

meta:
  bitrise.io:
    stack: osx-xcode-16.4.x

app:
  envs:
  - BITRISE_PROJECT_PATH: FixtureApp.xcodeproj
  - BITRISE_SCHEME: FixtureApp

trigger_map:
- push_branch: "*"
  workflow: selective_tests
- pull_request_target_branch: main
  workflow: selective_tests

workflows:
  # Baseline: same build, every test target runs. Compare its Test Reports with selective_tests.
  full_tests:
    steps:
    - git-clone@8: {}
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - xcode-test-without-building@1:
        inputs:
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2: {}

  selective_tests:
    steps:
    - git-clone@8: {}
    - xcode-build-for-test@3:
        inputs:
        - destination: generic/platform=iOS Simulator
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        # Push builds have no BITRISEIO_GIT_BRANCH_DEST; diff against main explicitly.
        - base_ref: main
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    # Branch build of the step: reads test-selection.json itself, skips when nothing is selected.
    - git::https://github.com/bitrise-steplib/bitrise-step-xcode-test-without-building.git@test-selection:
        inputs:
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - script@1:
        title: Show selection
        is_always_run: true
        inputs:
        - content: |-
            #!/usr/bin/env bash
            echo "mode: ${BITRISE_TEST_SELECTION_MODE:-?}  summary: ${BITRISE_TEST_SELECTION_SUMMARY:-?}"
            if [ -n "$BITRISE_TEST_SELECTION_PATH" ]; then cat "$BITRISE_TEST_SELECTION_PATH"; fi
    - deploy-to-bitrise-io@2: {}

  # Same selection, consumed by the one-shot Xcode Test step (build + test, no xctestrun).
  selective_tests_xcode_test:
    steps:
    - git-clone@8: {}
    - git::https://github.com/bitrise-steplib/bitrise-step-test-selection.git@main:
        title: Test Selection
        inputs:
        - base_ref: main
        - mode: enforce
        - on_unknown_file: full
        - on_error: full
        - verbose: "true"
    - git::https://github.com/bitrise-steplib/steps-xcode-test.git@test-selection:
        inputs:
        - test_selection: $BITRISE_TEST_SELECTION_PATH
        - on_empty_selection: skip
        - destination: platform=iOS Simulator,name=iPhone 16,OS=latest
    - deploy-to-bitrise-io@2: {}
